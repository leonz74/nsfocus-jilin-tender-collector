[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jilin-tender-downloader"
version = "0.3.0"
description = "标书采集平台 · NSFOCUS 吉林代表处"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
pdf = ["pypdf>=5.0"]

[project.scripts]
jilin-tender = "tender_downloader.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tender_downloader = ["webui/static/*", "data/*"]
